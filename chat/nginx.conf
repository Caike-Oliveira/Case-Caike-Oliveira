server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location = /requisicoes {
        proxy_pass http://backend:8000;
        proxy_read_timeout 115s;
    }

    location /requisicoes/ {
        proxy_pass http://backend:8000;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
