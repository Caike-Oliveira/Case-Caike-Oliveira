services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: compras
      POSTGRES_PASSWORD: compras
      POSTGRES_DB: compras
    volumes:
      - compras:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U compras -d compras"]
      interval: 2s
      timeout: 3s
      retries: 15

  mcp:
    build:
      context: .
    command: ["uvicorn", "catalogo:app", "--host", "0.0.0.0", "--port", "8001"]
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8001), 2).close()"]
      interval: 2s
      timeout: 3s
      retries: 15

  backend:
    build:
      context: .
    command: ["uvicorn", "backend:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL: postgresql://compras:compras@postgres:5432/compras?connect_timeout=5
      MCP_URL: http://mcp:8001/mcp
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-4o-mini}
    depends_on:
      postgres:
        condition: service_healthy
      mcp:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/saude', timeout=2).close()"]
      interval: 2s
      timeout: 3s
      retries: 15

  chat:
    build: ./chat
    ports:
      - "127.0.0.1:${CHAT_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  compras:
